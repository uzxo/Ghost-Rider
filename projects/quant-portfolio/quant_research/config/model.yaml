# ============================================================
# Model Hyperparameters
# ============================================================

xgboost:
  n_estimators: 500
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.7
  reg_alpha: 0.1
  reg_lambda: 1.0
  min_child_weight: 10
  objective: "reg:squarederror"
  early_stopping_rounds: 50

lightgbm:
  n_estimators: 500
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.7
  reg_alpha: 0.1
  reg_lambda: 1.0
  min_child_samples: 20
  objective: "regression"
  early_stopping_rounds: 50

elastic_net:
  alpha: 0.1
  l1_ratio: 0.5
  max_iter: 5000
  tol: 0.0001

hmm:
  n_states: 4
  n_iter: 200
  covariance_type: "full"
  features:
    - vix
    - yield_curve_2s10s
    - credit_spread
    - market_breadth

ensemble:
  method: "ridge"                    # ridge | isotonic | linear
  alpha: 1.0                        # Ridge regularization
  use_regime_conditioning: true

prediction:
  target: "excess_return_rank"       # excess_return_rank | direction | risk_adjusted
  horizon_days: 21                   # ~1 month forward
  winsorize_pct: [1, 99]            # Percentile bounds
